[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix"
version = "1.0.0"
description = "IncuBrix AI Background Music Engine for Video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "minio>=7.2.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "imageio-ffmpeg>=0.4.9",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
